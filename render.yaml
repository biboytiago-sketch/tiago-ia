services:
  - type: web
    name: tiago-ia-1
    runtime: docker
    region: sao-paulo
    plan: starter
    dockerCommand: ./Dockerfile
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: "/ping"
    autoDeploy: yes
    envVars:
      - key: PORT
        value: "10000"
      - key: HOST
        value: "0.0.0.0"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"
      - key: GEMINI_API_KEY
        sync: false
      - key: RAPIDAPI_KEY
        sync: false
      - key: RAPIDAPI_HOST_FLASHLIVE
        value: "flashlive-sports.p.rapidapi.com"
      - key: RAPIDAPI_HOST_FREEAPI
        value: "free-api-live-football-data.p.rapidapi.com"
      - key: RAPIDAPI_HOST_LEGACY
        value: "api-football-v1.p.rapidapi.com"
      - key: RAPIDAPI_HOST
        value: "flashlive-sports.p.rapidapi.com"
      - key: FOOTBALL_API_KEY
        sync: false
      - key: RAPIDAPI_HOST_SPORTS_NEWS
        value: "sports-information.p.rapidapi.com"
      - key: RAPIDAPI_HOST_CRICBUZZ
        value: "cricbuzz-cricket.p.rapidapi.com"
      - key: RAPIDAPI_HOST_TODAY_FOOTBALL_PREDICT
        value: "today-football-prediction.p.rapidapi.com"
      - key: RAPIDAPI_HOST_SOFASPORT
        value: "sofasport.p.rapidapi.com"
      - key: RAPIDAPI_HOST_BET365_INPLAY
        value: "bet365-api-inplay.p.rapidapi.com"
      - key: RAPIDAPI_HOST_1XBET
        value: "1xbet-api.p.rapidapi.com"
      - key: RAPIDAPI_HOST_FOOTBALL_PRO
        value: "football-pro.p.rapidapi.com"
      - key: FOOTBALL_DATA_ORG_KEY
        sync: false
      - key: API_FOOTBALL_KEY
        sync: false

staticSites:
  # ============================================================
  # Frontend Flutter Web (acessível de QUALQUER celular, 5G/4G)
  # Build: baixa o Flutter SDK, roda `flutter build web --release`
  # Publica: ./frontend_flutter/build/web
  # ============================================================
  - name: tiago-frontend
    region: sao-paulo
    plan: starter
    buildCommand: "chmod +x ./scripts/build_flutter_web_render.sh && ./scripts/build_flutter_web_render.sh"
    publishDir: "./frontend_flutter/build/web"
    # SPA (Single Page App) Flutter: qualquer rota (ex: /home, /tickets)
    # cai no index.html para o Flutter Router carregar a tela certa.
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    autoDeploy: yes

